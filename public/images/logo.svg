<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Blue Outer Orbital Ring -->
    <linearGradient id="blueRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072CE" />
      <stop offset="50%" stop-color="#003E7E" />
      <stop offset="100%" stop-color="#001D40" />
    </linearGradient>

    <!-- Gold Inner Orbital Ring -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="50%" stop-color="#FF8500" />
      <stop offset="100%" stop-color="#C43B00" />
    </linearGradient>

    <!-- Lens Aperture Body Gradient -->
    <linearGradient id="lensBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004080" />
      <stop offset="60%" stop-color="#001E3D" />
      <stop offset="100%" stop-color="#000D1A" />
    </linearGradient>
  </defs>

  <!-- 1. Left Outer Blue Film Ring -->
  <ellipse
    cx="100"
    cy="100"
    rx="92"
    ry="40"
    transform="rotate(-28 100 100)"
    stroke="url(#blueRing)"
    stroke-width="9"
  />
  <ellipse
    cx="100"
    cy="100"
    rx="92"
    ry="40"
    transform="rotate(-28 100 100)"
    stroke="#66B2FF"
    stroke-width="1.5"
    stroke-dasharray="4 3"
    opacity="0.8"
  />

  <!-- 2. Right Inner Gold Film Ring -->
  <ellipse
    cx="100"
    cy="100"
    rx="85"
    ry="36"
    transform="rotate(22 100 100)"
    stroke="url(#goldRing)"
    stroke-width="8"
  />
  <ellipse
    cx="100"
    cy="100"
    rx="85"
    ry="36"
    transform="rotate(22 100 100)"
    stroke="#FFF2A3"
    stroke-width="1.2"
    stroke-dasharray="5 3"
    opacity="0.9"
  />

  <!-- 3. Central Lens Aperture Circle -->
  <circle cx="100" cy="100" r="54" fill="url(#lensBody)" stroke="url(#goldRing)" stroke-width="3.5" />
  
  <!-- Inner Dark Lens Rim -->
  <circle cx="100" cy="100" r="48" fill="#001226" stroke="#0055A5" stroke-width="1.5" />

  <!-- Curved Aperture Blades -->
  <g stroke="#FFB700" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 100 52 C 118 68, 118 84, 100 100" />
    <path d="M 148 100 C 132 118, 116 118, 100 100" />
    <path d="M 100 148 C 82 132, 82 116, 100 100" />
    <path d="M 52 100 C 68 82, 84 82, 100 100" />
  </g>

  <!-- Shiny Lens Core Flare -->
  <circle cx="100" cy="100" r="16" fill="#FFFFFF" opacity="0.9" />
  <circle cx="100" cy="100" r="10" fill="#FFE066" />
</svg>
