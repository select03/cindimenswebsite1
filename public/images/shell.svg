<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Workshop Ambience Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="35%" stop-color="#11151c" />
      <stop offset="70%" stop-color="#181e26" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Warm Workshop Rim Lighting on Mechanic in Background Right -->
    <radialGradient id="mechanicWarmGlow" cx="88%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#181e26" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom Golden Accent Glow Line -->
    <linearGradient id="bottomGoldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100" stop-opacity="0" />
      <stop offset="25%" stop-color="#FFD100" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#FBBF24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFD100" stop-opacity="0" />
    </linearGradient>

    <!-- Golden Highlight Pill Button -->
    <linearGradient id="goldButtonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FFC800" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Phone Bezel Gradient (Metallic Silver/Gold Edge) -->
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Phone Outer Soft Case -->
    <linearGradient id="phoneCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Hand Skin Gradients -->
    <linearGradient id="skinBase" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#d69b7a" />
      <stop offset="40%" stop-color="#bf825e" />
      <stop offset="80%" stop-color="#965a38" />
      <stop offset="100%" stop-color="#6e3a1d" />
    </linearGradient>

    <linearGradient id="thumbHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e8b898" />
      <stop offset="50%" stop-color="#cb8f6c" />
      <stop offset="100%" stop-color="#8a4f2e" />
    </linearGradient>

    <!-- Golden Oil Splash Gradient -->
    <linearGradient id="goldOil" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Filters for Depth and Glow -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-15" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="bgBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <filter id="goldTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- BACKGROUND: Cinematic Car Maintenance Workshop -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Background Workshop Elements (Blurred for Cinematic Depth of Field) -->
  <g filter="url(#bgBlur)" opacity="0.65">
    <!-- Lifted Car Wheel / Undercarriage in Background Top Center -->
    <ellipse cx="980" cy="80" rx="140" ry="110" fill="#0f172a" stroke="#334155" stroke-width="12" />
    <circle cx="980" cy="80" r="70" fill="#1e293b" />
    <circle cx="980" cy="80" r="28" fill="#475569" />
    <path d="M 840 80 L 1120 80 M 980 -60 L 980 220" stroke="#334155" stroke-width="8" />

    <!-- Car Lift Yellow Hydraulic Pillar in Background Right -->
    <rect x="1380" y="0" width="45" height="420" fill="#eab308" opacity="0.4" />
    <rect x="1390" y="0" width="25" height="420" fill="#ca8a04" opacity="0.5" />

    <!-- Workshop Mechanic in uniform with Shell back emblem -->
    <g transform="translate(1420, 40)">
      <!-- Head / Mask -->
      <circle cx="280" cy="140" r="42" fill="#cbd5e1" />
      <path d="M 270 150 C 270 170 315 170 315 150 Z" fill="#f8fafc" /> <!-- Face mask -->
      <path d="M 255 110 C 265 95 305 95 315 110 Z" fill="#1e293b" /> <!-- Hair -->
      
      <!-- Torso / Navy Workshop Uniform -->
      <path d="M 200 210 C 210 180 340 180 350 210 L 370 420 L 180 420 Z" fill="#1e293b" />
      <path d="M 200 210 L 140 320 L 175 335 L 220 260 Z" fill="#1e293b" /> <!-- Left arm -->

      <!-- Shell Emblem on Mechanic's Back Uniform -->
      <circle cx="275" cy="270" r="36" fill="#fef08a" opacity="0.85" />
      <path d="M 255 285 C 255 255 295 255 295 285 Z" fill="#dc2626" />
      <path d="M 258 283 C 258 260 292 260 292 283" stroke="#facc15" stroke-width="4" fill="none" />
    </g>
  </g>

  <!-- Warm Sun / Studio Backlight on Mechanic & Workshop -->
  <circle cx="1780" cy="160" r="450" fill="url(#mechanicWarmGlow)" />

  <!-- LEFT COLUMN: Marketing & Title Content -->
  <g transform="translate(90, 75)">
    
    <!-- Top Branding Row: Shell Helix + 官方車輛保修 App -->
    <g transform="translate(0, 0)">
      <!-- Shell Scallop Logo -->
      <path d="M 12 70 C 12 28 84 28 84 70 Z" fill="#EE1C25" />
      <path d="M 18 68 C 18 36 78 36 78 68" stroke="#FFD100" stroke-width="5" fill="none" />
      <path d="M 28 68 C 28 44 68 44 68 68" stroke="#FFD100" stroke-width="4" fill="none" />
      <path d="M 40 68 C 40 52 56 52 56 68" stroke="#FFD100" stroke-width="3" fill="none" />
      
      <!-- Shell HELIX Typography -->
      <text x="105" y="38" font-family="'Noto Sans TC', Arial, sans-serif" font-size="28" font-weight="900" fill="#EE1C25" letter-spacing="1">Shell</text>
      <text x="105" y="70" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#EE1C25" font-style="italic">HEL</text>
      <!-- Red & Blue X in HELIX -->
      <polygon points="215,36 240,70 262,70 236,36" fill="#EE1C25" />
      <polygon points="248,36 220,70 200,70 228,36" fill="#004B87" />
      
      <!-- Chinese Brand Subtitle: 喜力汽車 -->
      <text x="275" y="68" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC">喜力汽車</text>

      <!-- Vertical Divider -->
      <line x1="385" y1="32" x2="385" y2="72" stroke="#475569" stroke-width="2" />

      <!-- Tag: 官方車輛保修 App -->
      <text x="410" y="66" font-family="'Noto Sans TC', sans-serif" font-size="28" font-weight="500" fill="#E2E8F0">官方車輛保修 App</text>
    </g>

    <!-- Main Headline: 讓愛車保修更簡單 -->
    <g transform="translate(0, 230)">
      <text x="0" y="0" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="94" font-weight="900" fill="#FFFFFF" letter-spacing="2">讓愛車保修</text>
      <!-- "更簡單" in Gold Brush Styling -->
      <text x="560" y="0" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="98" font-weight="900" fill="#FFD100" filter="url(#goldTextGlow)">更簡單</text>
      <!-- Gold Underline Brush Stroke -->
      <path d="M 550 20 Q 720 10 880 22" stroke="#FFD100" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9" />
    </g>

    <!-- Subheadline: Shell 喜力汽車 App 操作指南與情境形象片 -->
    <text x="0" y="320" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" letter-spacing="1">
      Shell 喜力汽車 App 操作指南與情境形象片
    </text>

    <!-- Paragraph Description (2 Lines) -->
    <g transform="translate(0, 395)" fill="#CBD5E1" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="26" font-weight="normal">
      <text x="0" y="0">從預約維修、履歷查詢到保養檢測，</text>
      <text x="0" y="44">用直覺操作與真實情境，帶您輕鬆掌握愛車保修每一步。</text>
    </g>

    <!-- 3 Circular Icon Feature Highlights -->
    <g transform="translate(0, 520)">
      <!-- Feature 1: 線上預約維修 -->
      <g transform="translate(0, 0)">
        <circle cx="48" cy="48" r="48" fill="#111827" stroke="#FFD100" stroke-width="3" />
        <!-- Calendar Icon in Gold -->
        <rect x="30" y="28" width="36" height="38" rx="6" fill="none" stroke="#FFD100" stroke-width="3" />
        <line x1="30" y1="40" x2="66" y2="40" stroke="#FFD100" stroke-width="2.5" />
        <circle cx="40" cy="50" r="2.5" fill="#FFD100" />
        <circle cx="56" cy="50" r="2.5" fill="#FFD100" />
        <circle cx="40" cy="58" r="2.5" fill="#FFD100" />
        <circle cx="56" cy="58" r="2.5" fill="#FFD100" />
        <line x1="38" y1="22" x2="38" y2="30" stroke="#FFD100" stroke-width="3" stroke-linecap="round" />
        <line x1="58" y1="22" x2="58" y2="30" stroke="#FFD100" stroke-width="3" stroke-linecap="round" />
        
        <text x="48" y="130" font-family="'Noto Sans TC', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">線上預約維修</text>
        <text x="48" y="165" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#94A3B8" text-anchor="middle">快速又方便</text>
      </g>

      <!-- Feature 2: 保養履歷查詢 -->
      <g transform="translate(240, 0)">
        <circle cx="48" cy="48" r="48" fill="#111827" stroke="#FFD100" stroke-width="3" />
        <!-- Car Front Silhouette Icon in Gold -->
        <path d="M 28 48 L 36 34 C 38 30 58 30 60 34 L 68 48 L 72 54 L 72 68 L 66 68 L 66 64 L 30 64 L 30 68 L 24 68 L 24 54 Z" fill="none" stroke="#FFD100" stroke-width="3" stroke-linejoin="round" />
        <circle cx="35" cy="54" r="4" fill="#FFD100" />
        <circle cx="61" cy="54" r="4" fill="#FFD100" />
        <line x1="42" y1="56" x2="54" y2="56" stroke="#FFD100" stroke-width="2.5" />
        
        <text x="48" y="130" font-family="'Noto Sans TC', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">保養履歷查詢</text>
        <text x="48" y="165" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#94A3B8" text-anchor="middle">愛車狀況一目了然</text>
      </g>

      <!-- Feature 3: 專業保養檢測 -->
      <g transform="translate(480, 0)">
        <circle cx="48" cy="48" r="48" fill="#111827" stroke="#FFD100" stroke-width="3" />
        <!-- Clipboard Checklist Icon in Gold -->
        <rect x="30" y="28" width="36" height="42" rx="4" fill="none" stroke="#FFD100" stroke-width="3" />
        <rect x="40" y="22" width="16" height="8" rx="2" fill="#111827" stroke="#FFD100" stroke-width="2.5" />
        <line x1="38" y1="42" x2="58" y2="42" stroke="#FFD100" stroke-width="2.5" />
        <line x1="38" y1="50" x2="58" y2="50" stroke="#FFD100" stroke-width="2.5" />
        <line x1="38" y1="58" x2="52" y2="58" stroke="#FFD100" stroke-width="2.5" />
        
        <text x="48" y="130" font-family="'Noto Sans TC', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">專業保養檢測</text>
        <text x="48" y="165" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#94A3B8" text-anchor="middle">安心駕馭每一程</text>
      </g>
    </g>

    <!-- Bottom CTA Button & Category Label -->
    <g transform="translate(0, 770)">
      <!-- Golden CTA Button: 觀看作品 > -->
      <rect x="0" y="0" width="290" height="74" rx="37" fill="url(#goldButtonGrad)" />
      <!-- Play Triangle Icon -->
      <polygon points="50,26 50,48 70,37" fill="#111827" />
      <text x="82" y="47" font-family="'Noto Sans TC', 'PingFang TC', sans-serif" font-size="28" font-weight="900" fill="#111827">觀看作品</text>
      <text x="215" y="47" font-family="sans-serif" font-size="28" font-weight="bold" fill="#111827">❯</text>

      <!-- Category Label: 商業形象片 × App 情境演示 -->
      <line x1="330" y1="18" x2="330" y2="56" stroke="#FFD100" stroke-width="4" stroke-linecap="round" />
      <text x="355" y="47" font-family="'Noto Sans TC', sans-serif" font-size="26" font-weight="500" fill="#E2E8F0">商業形象片 × App 情境演示</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Angled 3D Smartphone held by Hand -->
  <g transform="translate(860, 240) rotate(-14)">
    
    <!-- Phone Shadow -->
    <rect x="180" y="30" width="580" height="980" rx="60" fill="#000000" opacity="0.65" filter="url(#phoneShadow)" />

    <!-- Phone Protective Clear Bumper Case -->
    <rect x="165" y="15" width="610" height="1010" rx="68" fill="none" stroke="url(#phoneCase)" stroke-width="18" />

    <!-- Phone Body (Silver / Champagne Gold Metallic Bezel) -->
    <rect x="175" y="25" width="590" height="990" rx="60" fill="url(#phoneFrame)" stroke="#64748b" stroke-width="2" />

    <!-- Top Speaker Earphone Grill & Front Camera -->
    <rect x="420" y="55" width="100" height="10" rx="5" fill="#475569" />
    <circle cx="380" cy="60" r="6" fill="#334155" />

    <!-- SMARTPHONE SCREEN (Displaying Shell Helix Car Maintenance App) -->
    <rect x="198" y="90" width="544" height="860" rx="14" fill="#18202c" />

    <!-- App Header: Shell HELIX 喜力汽車 + Hamburger Menu -->
    <g transform="translate(198, 90)">
      <rect x="0" y="0" width="544" height="70" fill="#111827" />
      
      <!-- Shell Scallop Logo in App Header -->
      <path d="M 128 44 C 128 22 158 22 158 44 Z" fill="#EE1C25" />
      <path d="M 131 43 C 131 26 155 26 155 43" stroke="#FFD100" stroke-width="2.5" fill="none" />
      
      <text x="168" y="32" font-family="'Noto Sans TC', Arial, sans-serif" font-size="14" font-weight="900" fill="#EE1C25">Shell</text>
      <text x="168" y="47" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#EE1C25" font-style="italic">HELIX</text>
      <text x="238" y="46" font-family="'Noto Sans TC', sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">喜力汽車</text>

      <!-- Hamburger Menu Lines -->
      <line x1="475" y1="30" x2="505" y2="30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="475" y1="38" x2="505" y2="38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <line x1="475" y1="46" x2="505" y2="46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- App 3 Top Feature Shortcut Cards -->
    <g transform="translate(216, 175)">
      <!-- Card 1: 預約維修 -->
      <rect x="0" y="0" width="158" height="135" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <rect x="58" y="24" width="42" height="42" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <line x1="58" y1="36" x2="100" y2="36" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="70" cy="48" r="2.5" fill="#FFFFFF" />
      <circle cx="88" cy="48" r="2.5" fill="#FFFFFF" />
      <text x="79" y="100" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="bold" fill="#F8FAFC" text-anchor="middle">預約維修</text>

      <!-- Card 2: 保養履歷 -->
      <rect x="172" y="0" width="158" height="135" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <path d="M 230 46 L 238 32 C 240 28 260 28 262 32 L 270 46 L 274 52 L 274 66 L 226 66 L 226 52 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <circle cx="237" cy="54" r="3" fill="#FFFFFF" />
      <circle cx="263" cy="54" r="3" fill="#FFFFFF" />
      <text x="251" y="100" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="bold" fill="#F8FAFC" text-anchor="middle">保養履歷</text>

      <!-- Card 3: 檢測服務 -->
      <rect x="344" y="0" width="158" height="135" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <!-- Diagnostic Tool / Wrench Icon -->
      <circle cx="423" cy="38" r="14" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M 415 48 L 405 66 L 413 70 L 423 52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <text x="423" y="100" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="bold" fill="#F8FAFC" text-anchor="middle">檢測服務</text>
    </g>

    <!-- App Hero Banner: 專業保養 守護每一程 + Shell Helix Ultra Oil Bottle -->
    <g transform="translate(198, 330)">
      <rect x="0" y="0" width="544" height="580" fill="#f8fafc" />

      <!-- Golden Lubricant Splash Effect -->
      <path d="M 270 90 Q 350 20 370 120 T 260 250 T 420 360" stroke="url(#goldOil)" stroke-width="32" stroke-linecap="round" fill="none" opacity="0.9" />
      <circle cx="360" cy="80" r="18" fill="#FFD100" />
      <circle cx="390" cy="120" r="12" fill="#F59E0B" />
      <circle cx="320" cy="40" r="10" fill="#EA580C" />

      <!-- Chinese Feature Slogan: 專業保養 守護每一程 -->
      <text x="45" y="125" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="44" font-weight="900" fill="#C92A1D" letter-spacing="1">專業保養</text>
      <text x="45" y="180" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="44" font-weight="900" fill="#C92A1D" letter-spacing="1">守護每一程</text>

      <!-- Shell HELIX Ultra Oil Bottle Representation -->
      <g transform="translate(290, 160)">
        <!-- Dark Grey Oil Bottle Container Body -->
        <path d="M 60 10 L 95 10 L 115 55 L 140 260 C 140 275 125 285 110 285 L 30 285 C 15 285 0 275 0 260 L 25 55 L 45 10 Z" fill="#334155" stroke="#0f172a" stroke-width="3" />
        <!-- Bottle Cap -->
        <rect x="65" y="-12" width="25" height="24" rx="4" fill="#64748b" />
        
        <!-- Bottle Label with Shell Helix Branding -->
        <rect x="25" y="90" width="90" height="150" rx="8" fill="#f8fafc" />
        <!-- Shell Logo Header on Bottle Label -->
        <path d="M 58 120 C 58 102 82 102 82 120 Z" fill="#EE1C25" />
        <path d="M 60 119 C 60 106 80 106 80 119" stroke="#FFD100" stroke-width="2" fill="none" />
        
        <text x="70" y="145" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#dc2626" text-anchor="middle">Shell</text>
        <text x="70" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">HELIX</text>
        <rect x="36" y="172" width="68" height="14" fill="#0284c7" rx="2" />
        <text x="70" y="183" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">ULTRA 5W-40</text>
      </g>

      <!-- Bottom Interactive Pagination Pill -->
      <g transform="translate(45, 410)">
        <circle cx="20" cy="20" r="20" fill="#F59E0B" />
        <text x="20" y="27" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">❯</text>
        <!-- Pagination Dots -->
        <circle cx="65" cy="20" r="6" fill="#94a3b8" />
        <circle cx="85" cy="20" r="6" fill="#cbd5e1" />
        <circle cx="105" cy="20" r="6" fill="#cbd5e1" />
      </g>
    </g>

    <!-- User's Hand Holding Phone in Workshop -->
    <!-- Lower Palm / Hand Base -->
    <path d="M 50 680 C 100 620 180 660 210 740 C 230 820 170 910 80 940 Z" fill="url(#skinBase)" />
    
    <!-- Main Thumb gripping front edge -->
    <path d="M 60 620 C 110 530 200 560 215 650 C 220 720 160 780 100 750 Z" fill="url(#thumbHighlight)" />
    <!-- Mechanic work skin tone detail -->
    <ellipse cx="145" cy="625" rx="14" ry="22" fill="#523223" opacity="0.35" />

    <!-- Supporting Fingers wrapping around back right -->
    <path d="M 720 680 C 800 700 815 780 735 810 Z" fill="url(#skinBase)" />
    <path d="M 710 790 C 790 810 800 880 720 905 Z" fill="url(#thumbHighlight)" />
  </g>

  <!-- Bottom Golden Ambient Lighting Bar -->
  <rect x="0" y="1068" width="1920" height="12" fill="url(#bottomGoldGlow)" />
</svg>
